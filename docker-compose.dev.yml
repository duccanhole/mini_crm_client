services:
  crm-client-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mini-crm-client-dev
    ports:
      - "3000:3000"
    # environment:
    #   # API Configuration - point to your local backend
    #   NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    #   NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    #   NEXT_PUBLIC_DEFAULT_ADMIN_EMAIL: ${NEXT_PUBLIC_DEFAULT_ADMIN_EMAIL:-admin@mail.com}
    #   NEXT_PUBLIC_DEFAULT_SALE_EMAIL: ${NEXT_PUBLIC_DEFAULT_SALE_EMAIL:-sale@mail.com}
    #   NEXT_PUBLIC_DEFAULT_MANAGER_EMAIL: ${NEXT_PUBLIC_DEFAULT_MANAGER_EMAIL:-manager@mail.com}
    #   NODE_ENV: development
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Exclude node_modules from mount (use container's node_modules)
      - /app/node_modules
      # Exclude .next from mount
      - /app/.next
    networks:
      - crm-network
    # Enable stdin and tty for interactive sessions
    stdin_open: true
    tty: true

  # Optional: Backend service for development
  # backend:
  #   image: your-crm-backend:dev
  #   container_name: mini-crm-backend-dev
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     DATABASE_URL: postgresql://crm_user:crm_password@postgres:5432/crm_db_dev
  #   volumes:
  #     - ../mini_crm_backend:/app
  #     - /app/node_modules
  #   networks:
  #     - crm-network
  #   depends_on:
  #     - postgres
  #   command: pnpm dev

  # postgres:
  #   image: postgres:16-alpine
  #   container_name: mini-crm-postgres-dev
  #   environment:
  #     POSTGRES_USER: crm_user
  #     POSTGRES_PASSWORD: crm_password
  #     POSTGRES_DB: crm_db_dev
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_dev_data:/var/lib/postgresql/data
  #   networks:
  #     - crm-network

networks:
  crm-network:
    driver: bridge

